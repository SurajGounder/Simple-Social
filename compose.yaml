services:

  backend:
    build: .
    command: uv run --no-sync uvicorn app.app:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/test.db

    volumes:
      - ./data:/app/data

  frontend:
    build: .
    command: uv run --no-sync streamlit run frontend.py --server.address=0.0.0.0 --server.port=8501

    ports:
      - "8501:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      - backend