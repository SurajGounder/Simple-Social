[project]
name = "fast-api-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.165.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.13.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fast-api-tutorial = "fast_api_tutorial:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
